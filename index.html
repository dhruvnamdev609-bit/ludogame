<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #17202a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #ffd700;
}

.game {
    max-width: 500px;
    margin: auto;
}

.board {
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    grid-template-rows: repeat(15, 1fr);
    width: min(92vw, 480px);
    aspect-ratio: 1;
    margin: 15px auto;
    border: 3px solid white;
    background: white;
    gap: 1px;
}

.cell {
    background: #eeeeee;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(8px, 2.5vw, 15px);
    color: #111;
}

.red-home { background: #ff5555; }
.green-home { background: #38d66b; }
.yellow-home { background: #ffe34d; }
.blue-home { background: #5599ff; }

.path { background: white; }
.safe { background: #d8d8d8; }

.center {
    background: conic-gradient(
        #38d66b 0deg 90deg,
        #ffe34d 90deg 180deg,
        #5599ff 180deg 270deg,
        #ff5555 270deg 360deg
    );
}

.piece {
    width: 75%;
    height: 75%;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 1px 4px #333;
    cursor: pointer;
    font-size: 10px;
    color: white;
    font-weight: bold;
}

.red { background: #e60000; }
.green { background: #009933; }
.yellow { background: #d4a900; }
.blue { background: #0055dd; }

.controls {
    background: #263746;
    padding: 15px;
    border-radius: 12px;
}

#dice {
    font-size: 48px;
    margin: 8px;
}

button {
    padding: 12px 20px;
    background: #ffd700;
    color: #17202a;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#status {
    min-height: 24px;
    color: #ffd700;
}

.players {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 12px 0;
}

.player {
    padding: 8px 10px;
    border-radius: 6px;
    background: #34495e;
}

.active {
    outline: 2px solid #ffd700;
}
</style>
</head>

<body>

<div class="game">
    <h1>🎲 LUDO GAME</h1>
    <p>पासा फेंकें और अपनी गोटी चलाएँ!</p>

    <div class="players" id="players"></div>

    <div class="board" id="board"></div>

    <div class="controls">
        <div id="dice">🎲</div>
        <button id="roll">Roll Dice</button>
        <p id="status">गेम शुरू करने के लिए पासा फेंकें।</p>
        <button onclick="newGame()">New Game</button>
    </div>
</div>

<script>
const colors = ["red", "green", "yellow", "blue"];
const names = ["लाल", "हरा", "पीला", "नीला"];
const emojis = ["🔴", "🟢", "🟡", "🔵"];

const board = document.getElementById("board");
const diceElement = document.getElementById("dice");
const statusElement = document.getElementById("status");
const rollButton = document.getElementById("roll");
const playersElement = document.getElementById("players");

let currentPlayer = 0;
let dice = 0;
let canMove = false;
let gameFinished = false;

let players = [];

const homes = {
    red:    [[1,1],[1,4],[4,1],[4,4]],
    green:  [[1,10],[1,13],[4,10],[4,13]],
    yellow: [[10,10],[10,13],[13,10],[13,13]],
    blue:   [[10,1],[10,4],[13,1],[13,4]]
};

// 52-cell outer path
const path = [
    [6,1],[6,2],[6,3],[6,4],[6,5],
    [5,6],[4,6],[3,6],[2,6],[1,6],[0,6],
    [0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],
    [6,9],[6,10],[6,11],[6,12],[6,13],[6,14],
    [7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],
    [9,8],[10,8],[11,8],[12,8],[13,8],[14,8],
    [14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],
    [8,5],[8,4],[8,3],[8,2],[8,1],[8,0],
    [7,0],[6,0]
];

// Each player's starting cell on the outer path
const starts = [0, 13, 26, 39];

// Safe squares
const safeSquares = [0, 8, 13, 21, 26, 34, 39, 47];

function buildBoard() {
    board.innerHTML = "";

    for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 15; c++) {
            const cell = document.createElement("div");
            cell.className = "cell";

            if (r < 6 && c < 6) cell.classList.add("red-home");
            else if (r < 6 && c > 8) cell.classList.add("green-home");
            else if (r > 8 && c > 8) cell.classList.add("yellow-home");
            else if (r > 8 && c < 6) cell.classList.add("blue-home");

            if (
                (r >= 6 && r <= 8) ||
                (c >= 6 && c <= 8)
            ) {
                cell.className = "cell path";
            }

            if (r >= 6 && r <= 8 && c >= 6 && c <= 8) {
                cell.className = "cell center";
                if (r === 7 && c === 7) cell.textContent = "★";
            }

            const index = path.findIndex(
                p => p[0] === r && p[1] === c
            );

            if (index !== -1) {
                cell.classList.add("path");

                if (safeSquares.includes(index)) {
                    cell.classList.add("safe");
                    cell.textContent = "★";
                }

                cell.dataset.path = index;
            }

            for (const color of colors) {
                const home = homes[color].some(
                    p => p[0] === r && p[1] === c
                );

                if (home) {
                    const pieceIndex = homes[color].findIndex(
                        p => p[0] === r && p[1] === c
                    );

                    const piece = document.createElement("button");
                    piece.className = `piece ${color}`;
                    piece.textContent = pieceIndex + 1;
                    piece.title = `${names[colors.indexOf(color)]} गोटी`;

                    piece.addEventListener("click", () => {
                        selectPiece(colors.indexOf(color), pieceIndex);
                    });

                    cell.appendChild(piece);
                }
            }

            board.appendChild(cell);
        }
    }
}

function newGame() {
    players = colors.map(() => ({
        pieces: [-1, -1, -1, -1]
    }));

    currentPlayer = 0;
    dice = 0;
    canMove = false;
    gameFinished = false;

    diceElement.textContent = "🎲";
    rollButton.disabled = false;

    buildBoard();
    renderPlayers();
    updateStatus("लाल खिलाड़ी की बारी! पासा फेंकें।");
}

function renderPlayers() {
    playersElement.innerHTML = "";

    colors.forEach((color, i) => {
        const div = document.createElement("div");
        div.className = "player" + (
            i === currentPlayer ? " active" : ""
        );
        div.textContent = `${emojis[i]} ${names[i]}`;
        playersElement.appendChild(div);
    });
}

function updateStatus(text) {
    statusElement.textContent = text;
    renderPlayers();
}

rollButton.addEventListener("click", rollDice);

function rollDice() {
    if (canMove || gameFinished) return;

    dice = Math.floor(Math.random() * 6) + 1;
    diceElement.textContent = ["⚀","⚁","⚂","⚃","⚄","⚅"][dice - 1];

    canMove = true;

    const movable = players[currentPlayer].pieces.filter(
        position => position === -1 ? dice === 6 : true
    );

    if (movable.length === 0) {
        updateStatus(`${names[currentPlayer]} को ${dice} मिला। कोई गोटी नहीं चल सकती।`);
        canMove = false;
        rollButton.disabled = true;

        setTimeout(() => {
            if (!gameFinished) {
                currentPlayer = (currentPlayer + 1) % 4;
                rollButton.disabled = false;
                updateStatus(`${names[currentPlayer]} की बारी!`);
            }
        }, 1200);

        return;
    }

    rollButton.disabled = true;
    updateStatus(`${names[currentPlayer]} को ${dice} मिला। अपनी गोटी चुनें।`);
}

function selectPiece(playerIndex, pieceIndex) {
    if (!canMove || playerIndex !== currentPlayer) return;

    const position = players[playerIndex].pieces[pieceIndex];

    if (position === -1 && dice !== 6) {
        updateStatus("गोटी बाहर निकालने के लिए 6 चाहिए!");
        return;
    }

    let newPosition;

    if (position === -1) {
        newPosition = 0;
    } else {
        newPosition = position + dice;
    }

    if (newPosition > 56) {
        updateStatus("इस गोटी को घर पहुँचाने के लिए सही नंबर चाहिए।");
        return;
    }

    players[playerIndex].pieces[pieceIndex] = newPosition;

    canMove = false;

    if (players[playerIndex].pieces.every(p => p === 56)) {
        gameFinished = true;
        updateStatus(`🎉 ${names[playerIndex]} खिलाड़ी जीत गया!`);
        return;
    }

    currentPlayer = dice === 6
        ? currentPlayer
        : (currentPlayer + 1) % 4;

    rollButton.disabled = false;

    buildBoard();
    updateStatus(`${names[currentPlayer]} की बारी! पासा फेंकें।`);
}

newGame();
</script>

</body>
</html>
